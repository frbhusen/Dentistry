name: Deploy AeroDent Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare demo site
        run: |
          mkdir -p _site/assets/js
          mkdir -p _site/assets/icons

          cp demo/index.html _site/index.html

          cp web/styles.css _site/assets/
          cp web/i18n.js _site/assets/
          cp web/db.js _site/assets/
          cp web/manifest.json _site/assets/
          cp web/sw.js _site/assets/

          cp web/js/*.js _site/assets/js/
          cp -r web/icons/* _site/assets/icons/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
